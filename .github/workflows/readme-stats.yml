name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Download GitHub Stats
        run: |
          curl -fsSL --retry 3 \
          "https://github-readme-stats.vercel.app/api?username=RedellenJ&show_icons=true&theme=github_dark_dimmed&hide=stars&line_height=28&rank_icon=github" \
          -o assets/stats.svg

      - name: Download Streak Stats
        run: |
          curl -fsSL --retry 3 \
          "https://streak-stats.demolab.com/?user=RedellenJ&background=24292f&border=373e47&stroke=373e47&currStreakNum=adbac7&sideNums=adbac7&sideLabels=adbac7&dates=adbac7&ring=539bf5&currStreakLabel=539bf5&fire=539bf5" \
          -o assets/streak-stats.svg

      - name: Generate Contribution Graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import date, timedelta

          username = "RedellenJ"
          today = date.today()
          start = today - timedelta(days=30)

          query = """
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              contributionsCollection(from:$from, to:$to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
            "query": query,
            "variables": {
              "login": username,
              "from": start.isoformat() + "T00:00:00Z",
              "to": today.isoformat() + "T23:59:59Z"
            }
          }).encode()

          request = urllib.request.Request(
            "https://api.github.com/graphql",
            data=payload,
            headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Content-Type": "application/json",
              "User-Agent": "RedellenJ-profile-stats"
            }
          )

          with urllib.request.urlopen(request) as response:
            data = json.load(response)

          days = []

          weeks = (
            data["data"]["user"]
            ["contributionsCollection"]
            ["contributionCalendar"]
            ["weeks"]
          )

          for week in weeks:
            for item in week["contributionDays"]:
              current_date = date.fromisoformat(item["date"])

              if start <= current_date <= today:
                days.append(
                  (
                    current_date,
                    item["contributionCount"]
                  )
                )

          days.sort()

          width = 1000
          height = 320

          left = 68
          right = 24
          top = 54
          bottom = 56

          plot_width = width - left - right
          plot_height = height - top - bottom

          max_value = max(
            [value for _, value in days] + [10]
          )

          y_max = max(
            10,
            ((max_value + 4) // 5) * 5
          )

          def x(index):
            return left + (
              plot_width
              * index
              / max(1, len(days) - 1)
            )

          def y(value):
            return (
              top
              + plot_height
              - (
                plot_height
                * value
                / y_max
              )
            )

          points = [
            (
              x(index),
              y(value)
            )
            for index, (_, value)
            in enumerate(days)
          ]

          def smooth_path(points):
            if not points:
              return ""

            if len(points) == 1:
              px, py = points[0]
              return f"M {px:.2f},{py:.2f}"

            path = [
              f"M {points[0][0]:.2f},{points[0][1]:.2f}"
            ]

            total = len(points)

            for index in range(total - 1):

              p0 = (
                points[index - 1]
                if index > 0
                else points[index]
              )

              p1 = points[index]
              p2 = points[index + 1]

              p3 = (
                points[index + 2]
                if index + 2 < total
                else p2
              )

              cp1x = (
                p1[0]
                + (p2[0] - p0[0]) / 6
              )

              cp1y = (
                p1[1]
                + (p2[1] - p0[1]) / 6
              )

              cp2x = (
                p2[0]
                - (p3[0] - p1[0]) / 6
              )

              cp2y = (
                p2[1]
                - (p3[1] - p1[1]) / 6
              )

              path.append(
                f"C "
                f"{cp1x:.2f},{cp1y:.2f} "
                f"{cp2x:.2f},{cp2y:.2f} "
                f"{p2[0]:.2f},{p2[1]:.2f}"
              )

            return " ".join(path)

          line_path = smooth_path(points)

          area_path = (
            line_path
            + f" L {points[-1][0]:.2f},{top + plot_height:.2f}"
            + f" L {points[0][0]:.2f},{top + plot_height:.2f}"
            + " Z"
          )

          horizontal_grid = []
          y_labels = []

          for value in range(
            0,
            y_max + 1,
            5
          ):

            yy = y(value)

            horizontal_grid.append(
              f'<line '
              f'x1="{left}" '
              f'y1="{yy:.2f}" '
              f'x2="{left + plot_width}" '
              f'y2="{yy:.2f}" '
              f'stroke="#444c56" '
              f'stroke-dasharray="3 3"/>'
            )

            y_labels.append(
              f'<text '
              f'x="{left - 12}" '
              f'y="{yy + 4:.2f}" '
              f'text-anchor="end" '
              f'fill="#adbac7" '
              f'font-size="12">'
              f'{value}'
              f'</text>'
            )

          vertical_grid = []
          x_labels = []

          for index, (current_date, _) in enumerate(days):

            xx = x(index)

            vertical_grid.append(
              f'<line '
              f'x1="{xx:.2f}" '
              f'y1="{top}" '
              f'x2="{xx:.2f}" '
              f'y2="{top + plot_height}" '
              f'stroke="#444c56" '
              f'stroke-dasharray="3 3"/>'
            )

            x_labels.append(
              f'<text '
              f'x="{xx:.2f}" '
              f'y="{height - 18}" '
              f'text-anchor="middle" '
              f'fill="#adbac7" '
              f'font-size="11">'
              f'{current_date.day}'
              f'</text>'
            )

          circles = "".join(
            f'<circle '
            f'cx="{px:.2f}" '
            f'cy="{py:.2f}" '
            f'r="4" '
            f'fill="#539bf5"/>'
            for px, py in points
          )

          svg = f"""
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}"
          >

            <rect
              width="100%"
              height="100%"
              rx="6"
              fill="#24292f"
              stroke="#373e47"
            />

            <text
              x="{width / 2}"
              y="32"
              text-anchor="middle"
              fill="#539bf5"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="600"
            >
              RedellenJ's Contribution Graph
            </text>

            <g font-family="Arial, sans-serif">
              {''.join(horizontal_grid)}
              {''.join(vertical_grid)}
              {''.join(y_labels)}
              {''.join(x_labels)}
            </g>

            <path
              d="{area_path}"
              fill="#adbac7"
              opacity="0.10"
            />

            <path
              d="{line_path}"
              fill="none"
              stroke="#adbac7"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            {circles}

            <text
              x="{width / 2}"
              y="{height - 4}"
              text-anchor="middle"
              fill="#adbac7"
              font-family="Arial, sans-serif"
              font-size="12"
            >
              Days
            </text>

            <text
              x="18"
              y="{top + plot_height / 2}"
              fill="#adbac7"
              font-family="Arial, sans-serif"
              font-size="12"
              transform="rotate(-90 18 {top + plot_height / 2})"
              text-anchor="middle"
            >
              Contributions
            </text>

          </svg>
          """

          with open(
            "assets/activity-graph.svg",
            "w",
            encoding="utf-8"
          ) as file:
            file.write(svg)

          PY

      - name: Validate SVG files
        run: |
          grep -q "<svg" assets/stats.svg
          grep -q "<svg" assets/streak-stats.svg
          grep -q "<svg" assets/activity-graph.svg
          ! grep -q "Something went wrong" assets/stats.svg

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/stats.svg \
            assets/streak-stats.svg \
            assets/activity-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi
