name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Download GitHub Stats
        run: |
          if curl -fsSL --retry 3 --retry-all-errors --max-time 30             "https://github-readme-stats.vercel.app/api?username=RedellenJ&show_icons=true&theme=github_dark_dimmed&hide=stars&line_height=28&rank_icon=github"             -o assets/stats-new.svg             && grep -q "<svg" assets/stats-new.svg             && ! grep -q "Something went wrong" assets/stats-new.svg; then
            mv assets/stats-new.svg assets/stats.svg
          else
            echo "::warning::GitHub Stats indisponivel; mantendo o ultimo SVG valido."
            rm -f assets/stats-new.svg
            test -s assets/stats.svg
          fi

      - name: Download Streak Stats
        run: |
          if curl -fsSL --retry 3 --retry-all-errors --max-time 30             "https://streak-stats.demolab.com/?user=RedellenJ&background=24292f&border=373e47&stroke=373e47&currStreakNum=adbac7&sideNums=adbac7&sideLabels=adbac7&dates=adbac7&ring=539bf5&currStreakLabel=539bf5&fire=539bf5"             -o assets/streak-new.svg             && grep -q "<svg" assets/streak-new.svg; then
            mv assets/streak-new.svg assets/streak-stats.svg
          else
            echo "::warning::Streak Stats indisponivel; mantendo o ultimo SVG valido."
            rm -f assets/streak-new.svg
            test -s assets/streak-stats.svg
          fi

      - name: Generate Contribution Graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import date, timedelta

          username = "RedellenJ"
          today = date.today()
          start = today - timedelta(days=30)

          query = """
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              contributionsCollection(from:$from, to:$to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username,
                  "from": start.isoformat() + "T00:00:00Z",
                  "to": today.isoformat() + "T23:59:59Z"
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "RedellenJ-profile-stats"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          if data.get("errors"):
              raise RuntimeError(str(data["errors"]))

          weeks = (
              data["data"]["user"]
                  ["contributionsCollection"]
                  ["contributionCalendar"]
                  ["weeks"]
          )

          counts = {}

          for week in weeks:
              for item in week["contributionDays"]:
                  counts[date.fromisoformat(item["date"])] = (
                      item["contributionCount"]
                  )

          days = [
              (
                  start + timedelta(days=i),
                  counts.get(start + timedelta(days=i), 0)
              )
              for i in range((today - start).days + 1)
          ]

          # Configuracao visual
          width = 1000
          height = 320

          left = 68
          right = 24
          top = 54
          bottom = 56

          plot_width = width - left - right
          plot_height = height - top - bottom

          max_value = max(
              [value for _, value in days] + [10]
          )

          y_max = max(
              10,
              ((max_value + 4) // 5) * 5
          )

          def x(index):
              return (
                  left
                  + plot_width * index / max(1, len(days) - 1)
              )

          def y(value):
              return (
                  top
                  + plot_height
                  - plot_height * value / y_max
              )

          baseline = y(0)

          points = [
              (x(index), y(value))
              for index, (_, value) in enumerate(days)
          ]

          # Curva suave sem valores negativos
          # Interpolacao monotona com tangentes limitadas
          def smooth_path(points):
              if not points:
                  return ""

              if len(points) == 1:
                  px, py = points[0]
                  return f"M {px:.2f},{py:.2f}"

              n = len(points)

              slopes = [
                  (points[i + 1][1] - points[i][1])
                  / (points[i + 1][0] - points[i][0])
                  for i in range(n - 1)
              ]

              tangents = [0.0] * n

              tangents[0] = slopes[0]
              tangents[-1] = slopes[-1]

              for i in range(1, n - 1):
                  a = slopes[i - 1]
                  b = slopes[i]

                  if a * b <= 0:
                      tangents[i] = 0.0
                  else:
                      tangents[i] = 2 * a * b / (a + b)

              path = [
                  f"M {points[0][0]:.2f},{points[0][1]:.2f}"
              ]

              for i in range(n - 1):
                  x1, y1 = points[i]
                  x2, y2 = points[i + 1]

                  dx = x2 - x1

                  m1 = tangents[i]
                  m2 = tangents[i + 1]

                  cp1x = x1 + dx / 3
                  cp1y = y1 + m1 * dx / 3

                  cp2x = x2 - dx / 3
                  cp2y = y2 - m2 * dx / 3

                  # Evita extrapolacao entre pontos
                  lower = min(y1, y2)
                  upper = max(y1, y2)

                  cp1y = max(lower, min(upper, cp1y))
                  cp2y = max(lower, min(upper, cp2y))

                  # Impede ultrapassar os limites do grafico
                  cp1y = max(top, min(baseline, cp1y))
                  cp2y = max(top, min(baseline, cp2y))

                  path.append(
                      f"C {cp1x:.2f},{cp1y:.2f} "
                      f"{cp2x:.2f},{cp2y:.2f} "
                      f"{x2:.2f},{y2:.2f}"
                  )

              return " ".join(path)

          line_path = smooth_path(points)

          area_path = (
              line_path
              + f" L {points[-1][0]:.2f},{baseline:.2f}"
              + f" L {points[0][0]:.2f},{baseline:.2f}"
              + " Z"
          )

          # Grade horizontal
          horizontal_grid = []
          y_labels = []

          for value in range(0, y_max + 1, 5):
              yy = y(value)

              horizontal_grid.append(
                  f'<line '
                  f'x1="{left}" '
                  f'y1="{yy:.2f}" '
                  f'x2="{left + plot_width}" '
                  f'y2="{yy:.2f}" '
                  f'stroke="#444c56" '
                  f'stroke-dasharray="3 3"/>'
              )

              y_labels.append(
                  f'<text '
                  f'x="{left - 12}" '
                  f'y="{yy + 4:.2f}" '
                  f'text-anchor="end" '
                  f'fill="#adbac7" '
                  f'font-size="12">'
                  f'{value}</text>'
              )

          # Grade vertical e dias individuais
          vertical_grid = []
          x_labels = []

          for index, (current_date, _) in enumerate(days):
              xx = x(index)

              vertical_grid.append(
                  f'<line '
                  f'x1="{xx:.2f}" '
                  f'y1="{top}" '
                  f'x2="{xx:.2f}" '
                  f'y2="{baseline:.2f}" '
                  f'stroke="#444c56" '
                  f'stroke-dasharray="3 3"/>'
              )

              x_labels.append(
                  f'<text '
                  f'x="{xx:.2f}" '
                  f'y="{height - 18}" '
                  f'text-anchor="middle" '
                  f'fill="#adbac7" '
                  f'font-size="11">'
                  f'{current_date.day}</text>'
              )

          # Pontos azuis
          circles = "".join(
              f'<circle '
              f'cx="{px:.2f}" '
              f'cy="{py:.2f}" '
              f'r="4" '
              f'fill="#539bf5"/>'
              for px, py in points
          )

          # Geracao do SVG
          svg = f"""<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}">

            <rect
              x="0.5"
              y="0.5"
              width="{width - 1}"
              height="{height - 1}"
              rx="6"
              fill="#24292f"
              stroke="#373e47"/>

            <text
              x="{width / 2}"
              y="32"
              text-anchor="middle"
              fill="#539bf5"
              font-family="Arial, sans-serif"
              font-size="20"
              font-weight="600">
              RedellenJ's Contribution Graph
            </text>

            <g font-family="Arial, sans-serif">
              {''.join(horizontal_grid)}
              {''.join(vertical_grid)}
              {''.join(y_labels)}
              {''.join(x_labels)}
            </g>

            <path
              d="{area_path}"
              fill="#adbac7"
              opacity="0.10"/>

            <path
              d="{line_path}"
              fill="none"
              stroke="#adbac7"
              stroke-width="4"
              stroke-linecap="round"
              stroke-linejoin="round"/>

            {circles}

            <text
              x="{width / 2}"
              y="{height - 4}"
              text-anchor="middle"
              fill="#adbac7"
              font-family="Arial, sans-serif"
              font-size="12">
              Days
            </text>

            <text
              x="18"
              y="{top + plot_height / 2}"
              fill="#adbac7"
              font-family="Arial, sans-serif"
              font-size="12"
              transform="rotate(-90 18 {top + plot_height / 2})"
              text-anchor="middle">
              Contributions
            </text>
          </svg>"""

          with open(
              "assets/activity-graph.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          PY

      - name: Validate SVG files
        run: |
          grep -q "<svg" assets/stats.svg
          grep -q "<svg" assets/streak-stats.svg
          grep -q "<svg" assets/activity-graph.svg
          ! grep -q "Something went wrong" assets/stats.svg

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            assets/stats.svg \
            assets/streak-stats.svg \
            assets/activity-graph.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi
